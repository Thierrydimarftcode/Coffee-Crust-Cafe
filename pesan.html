<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pemesanan</title>
</head>
<body>

        <section id="beli">
            <h2 align="center">Pemesanan On The Spot</h2>
            <form action="">
                <table border="1" cellpadding="1" cellspacing="1" align="center">
                    <tr>
                        <td>Nama Pemesan</td>
                        <td>:</td>
                        <td><input type="text" name="Nama_Pemesan" placeholder="Masukkan nama pemesan" size="25" required></td>
                    </tr>

                    <tr>
                        <td>Nomor Meja</td>
                        <td>:</td>
                        <td><input type="number" name="Nomor_Meja" placeholder="Masukkan nomor meja" size="25" required></td>
                    </tr>

                    <tr>
                        <td>Menu</td>
                        <td>:</td>
                        <td>
                            <select name="Menu" id="" required>
                                <option value="">--Pilih Menu--</option>
                                <option value="">-Menu Kopi-</option>
                                <option value="Kopi Susu Gula Aren">Kopi Susu Gula Aren</option>
                                <option value="Americano">Americano</option>
                                <option value="Cappucino">Cappucino</option>
                                <option value="Latte">Latte</option>
                                <option value="">-Menu Pizza-</option>
                                <option value="Pizza Meatlovers">Pizza Meatlovers</option>
                                <option value="Pizza Oriental">Pizza Oriental</option>
                                <option value="Pizza Smoked Beef">Pizza Smoked Beef</option>
                                <option value="Pizza Pepperoni">Pizza Pepperoni</option>
                                <option value="">-Menu Roti-</option>
                                <option value="Roti Bakar">Roti Bakar</option>
                                <option value="Roti Hot Beef">Roti Hot Beef</option>
                                <option value="Croissant Bread">Croissant Bread</option>
                                <option value="Roti Sandwich">Roti Sandwich</option>
                            </select>
                        </td>
                    </tr>

                    <tr>
                        <td>Catatan Tambahan</td>
                        <td>:</td>
                        <td><textarea name="Catatan_Tambahan" rows="4" cols="30" placeholder="Contoh: Latte Less Sugar/Extra Saos atau tidak pedas"></textarea></td>
                    </tr>

                    <tr>
                        <td colspan="3" align="center">
                            <button type="submit">Pesan</button>
                        </td>
                    </tr>
                </table>
            </form>
        </section>

    <footer align="center">
        <p>&copy; 2026 Kopi & Crust Café.</p>
    </footer>
</body>
</html>
